name: Monitoraggio Growatt Inverter

on:
  schedule:
    # Esegue il controllo ogni 10 minuti
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # Permette di salvare state.json nel repository

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Esegui monitoraggio
        env:
          GROWATT_USER_1: ${{ secrets.GROWATT_USER_1 }}
          GROWATT_PASS_1: ${{ secrets.GROWATT_PASS_1 }}
          GROWATT_USER_2: ${{ secrets.GROWATT_USER_2 }}
          GROWATT_PASS_2: ${{ secrets.GROWATT_PASS_2 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva stato contatore
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornato stato monitoraggio [skip ci]" && git push)
